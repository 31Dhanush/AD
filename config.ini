# Configuration File for Alzheimer's Prediction Model

[model]
# Vision Transformer for MRI
mri_img_size = 128
mri_patch_size = 16
mri_in_channels = 1
mri_embed_dim = 256
mri_num_heads = 8
mri_num_layers = 6
mri_mlp_dim = 1024

# Clinical Encoder
clinical_input_dim = 20
clinical_hidden_dims = [128, 64]
clinical_embed_dim = 64
clinical_lstm_hidden = 128
clinical_lstm_layers = 2

# Temporal Transformer
temporal_num_timepoints = 3
temporal_num_heads = 8
temporal_num_layers = 4
temporal_mlp_dim = 512

# Fusion
fusion_mri_dim = 256
fusion_clinical_dim = 64
fusion_fusion_dim = 128

# General
num_classes = 2
dropout = 0.1
num_epochs = 100
batch_size = 4
learning_rate = 0.001
weight_decay = 1e-5

[training]
# Optimizer
optimizer = AdamW
learning_rate = 0.001
weight_decay = 1e-5
beta1 = 0.9
beta2 = 0.999

# Scheduler
scheduler = CosineAnnealingWarmRestarts
T_0 = 10
T_mult = 2

# Loss function
loss_type = MultimodalLoss
lambda_focal = 1.0
lambda_temporal = 0.1
lambda_contrast = 0.05

# Training
epochs = 100
batch_size = 4
num_workers = 4
gradient_clip = 1.0
patience = 15
device = cuda

[data]
# Data paths
data_dir = ./data
raw_data_dir = ./data/raw
processed_data_dir = ./data/processed
clinical_data_dir = ./data/clinical

# Preprocessing
train_split = 0.7
val_split = 0.15
test_split = 0.15
random_seed = 42

# MRI preprocessing
mri_target_shape = (128, 128, 128)
mri_normalize = true
mri_skull_strip = true
mri_threshold = 0.1

# Clinical preprocessing
clinical_impute_strategy = median
clinical_outlier_threshold = 3
clinical_scale = true

[evaluation]
# Metrics
compute_auc = true
compute_sensitivity = true
compute_specificity = true
compute_f1 = true

# Age stratification
age_bins = [50, 60, 70, 80]

[explainability]
# Attention visualization
plot_attention_maps = true
num_layers_to_plot = 6
attention_slice_idx = auto

# Grad-CAM
compute_gradcam = true
gradcam_layer = mri_encoder.norm
gradcam_variant = gradcampp

# Integrated Gradients
compute_integrated_gradients = true
ig_num_steps = 50

# SHAP
compute_shap = true
shap_num_samples = 100
shap_model_type = kernel

[paths]
checkpoint_dir = ./models_saved
tensorboard_dir = ./runs
output_dir = ./outputs
